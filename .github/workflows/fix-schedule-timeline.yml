name: Fix schedule timeline

on:
  push:
    branches: [agent/ios26-ui-polish]
    paths: [.github/workflows/fix-schedule-timeline.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios26-ui-polish
      - name: Patch timeline drawing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt')
          text = p.read_text()

          def one(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          one('import androidx.compose.foundation.background\n', '')
          one('import androidx.compose.foundation.layout.matchParentSize\n', '')
          one('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.draw.drawBehind\nimport androidx.compose.ui.geometry.Offset\nimport androidx.compose.ui.graphics.Color\n')
          one(
              '''    val motion = LocalMotionPolicy.current
    Box(
        modifier = Modifier
            .fillMaxWidth()
            .animateContentSize(animationSpec = motion.iosSpring()),
    ) {
        Box(
            modifier = Modifier
                .matchParentSize()
                .padding(start = 11.5.dp, top = 34.dp, bottom = 34.dp),
            contentAlignment = Alignment.CenterStart,
        ) {
            Box(
                modifier = Modifier
                    .width(1.dp)
                    .fillMaxHeight()
                    .background(MaterialTheme.colorScheme.outlineVariant),
            )
        }
        Column(verticalArrangement = Arrangement.spacedBy(9.dp)) {''',
              '''    val motion = LocalMotionPolicy.current
    val timelineColor = MaterialTheme.colorScheme.outlineVariant
    Box(
        modifier = Modifier
            .fillMaxWidth()
            .animateContentSize(animationSpec = motion.iosSpring())
            .drawBehind {
                val x = 11.5.dp.toPx()
                val inset = 34.dp.toPx()
                drawLine(
                    color = timelineColor,
                    start = Offset(x, inset),
                    end = Offset(x, (size.height - inset).coerceAtLeast(inset)),
                    strokeWidth = 1.dp.toPx(),
                )
            },
    ) {
        Column(verticalArrangement = Arrangement.spacedBy(9.dp)) {'''
          )
          p.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt
          git commit -m "Draw dashboard timeline without matchParentSize"
          git push origin HEAD:agent/ios26-ui-polish
