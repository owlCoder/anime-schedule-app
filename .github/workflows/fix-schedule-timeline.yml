name: Fix schedule timeline

on:
  push:
    branches:
      - agent/ios26-ui-polish
    paths:
      - .github/workflows/fix-schedule-timeline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios26-ui-polish
      - name: Patch timeline drawing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt')
          text = path.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          one('import androidx.compose.foundation.background\n', '', 'background import')
          one('import androidx.compose.foundation.layout.matchParentSize\n', '', 'matchParentSize import')
          one(
              'import androidx.compose.ui.graphics.Color\n',
              'import androidx.compose.ui.draw.drawBehind\nimport androidx.compose.ui.geometry.Offset\nimport androidx.compose.ui.graphics.Color\n',
              'drawing imports',
          )

          pattern = re.compile(
              r'    val motion = LocalMotionPolicy\.current\n'
              r'    Box\(\n'
              r'        modifier = Modifier\n'
              r'            \.fillMaxWidth\(\)\n'
              r'            \.animateContentSize\(animationSpec = motion\.iosSpring\(\)\),\n'
              r'    \) \{\n'
              r'        Box\(.*?'
              r'        Column\(verticalArrangement = Arrangement\.spacedBy\(9\.dp\)\) \{',
              re.S,
          )
          replacement = '\n'.join([
              '    val motion = LocalMotionPolicy.current',
              '    val timelineColor = MaterialTheme.colorScheme.outlineVariant',
              '    Box(',
              '        modifier = Modifier',
              '            .fillMaxWidth()',
              '            .animateContentSize(animationSpec = motion.iosSpring())',
              '            .drawBehind {',
              '                val x = 11.5.dp.toPx()',
              '                val inset = 34.dp.toPx()',
              '                drawLine(',
              '                    color = timelineColor,',
              '                    start = Offset(x, inset),',
              '                    end = Offset(x, (size.height - inset).coerceAtLeast(inset)),',
              '                    strokeWidth = 1.dp.toPx(),',
              '                )',
              '            },',
              '    ) {',
              '        Column(verticalArrangement = Arrangement.spacedBy(9.dp)) {',
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'timeline body: expected one match, found {count}')
          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt
          git commit -m "Draw dashboard timeline without matchParentSize"
          git push origin HEAD:agent/ios26-ui-polish
