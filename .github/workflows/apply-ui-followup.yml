name: Apply UI follow-up

on:
  push:
    branches: [agent/ios26-ui-polish]
    paths: [.github/workflows/apply-ui-followup.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios26-ui-polish
          fetch-depth: 0

      - name: Apply UI polish patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")
              return result

          def add_strings(path, entries, marker):
              text = read(path)
              if marker not in text:
                  text = replace_once(text, "</resources>", entries + "\n</resources>", path)
                  write(path, text)

          # Continue arrow after text.
          path = "app/src/main/java/com/owlcoder/animeschedule/presentation/components/GlassButton.kt"
          text = read(path)
          text = replace_once(
              text,
              "import androidx.compose.foundation.layout.sizeIn\nimport androidx.compose.material3.Icon",
              "import androidx.compose.foundation.layout.sizeIn\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.automirrored.filled.ArrowForward\nimport androidx.compose.material3.Icon",
              "GlassButton imports",
          )
          text = regex_once(
              text,
              r"@Composable\nprivate fun ButtonContent\(.*?\n\}\n\n@Composable\nfun GlassButton",
              '''@Composable
          private fun ButtonContent(label: String, icon: ImageVector?, color: Color, enabled: Boolean) {
              val resolved = if (enabled) color else color.copy(alpha = 0.42f)
              val trailingIcon = icon == Icons.AutoMirrored.Filled.ArrowForward
              if (icon != null && !trailingIcon) {
                  Icon(icon, null, Modifier.size(18.dp), tint = resolved)
              }
              Text(
                  text = label,
                  color = resolved,
                  style = MaterialTheme.typography.labelLarge,
                  fontWeight = FontWeight.SemiBold,
                  maxLines = 1,
              )
              if (icon != null && trailingIcon) {
                  Icon(icon, null, Modifier.size(18.dp), tint = resolved)
              }
          }

          @Composable
          fun GlassButton''',
              "ButtonContent",
          )
          write(path, text)

          # Rounded onboarding controls own their press feedback; no rectangular hover/ripple.
          path = "app/src/main/java/com/owlcoder/animeschedule/presentation/screens/onboarding/OnboardingScreen.kt"
          text = read(path)
          text = replace_once(
              text,
              "import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.layout.Arrangement",
              "import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.interaction.MutableInteractionSource\nimport androidx.compose.foundation.layout.Arrangement",
              "Onboarding imports",
          )
          text = replace_once(
              text,
              "@Composable\nprivate fun FeatureTile(",
              '''@Composable
          private fun Modifier.onboardingClickable(onClick: () -> Unit): Modifier {
              val interactionSource = remember { MutableInteractionSource() }
              return clickable(
                  interactionSource = interactionSource,
                  indication = null,
                  onClick = onClick,
              )
          }

          @Composable
          private fun FeatureTile(''',
              "Onboarding clickable helper",
          )
          text = text.replace(".clickable(onClick = onClick)", ".onboardingClickable(onClick)")
          text = text.replace(".clickable { onAccentChange(accent) }", ".onboardingClickable { onAccentChange(accent) }")
          write(path, text)

          # Light-theme glass must remain visibly separated from the background.
          path = "app/src/main/java/com/owlcoder/animeschedule/ui/theme/GlassTokens.kt"
          text = read(path)
          for old, new in [
              ("val shadow = Color.Black.copy(alpha = 0.11f)", "val shadow = Color.Black.copy(alpha = 0.16f)"),
              ("val neutralFillLight = Color.White.copy(alpha = 0.44f)", "val neutralFillLight = Color.White.copy(alpha = 0.72f)"),
              ("val selectedFillLight = Color.White.copy(alpha = 0.62f)", "val selectedFillLight = Color.White.copy(alpha = 0.82f)"),
              ("val interactiveFillLight = Color.White.copy(alpha = 0.58f)", "val interactiveFillLight = Color.White.copy(alpha = 0.78f)"),
          ]:
              text = replace_once(text, old, new, "GlassTokens")
          write(path, text)

          path = "app/src/main/java/com/owlcoder/animeschedule/presentation/components/GlassSurface.kt"
          text = read(path)
          text = replace_once(text, "GlassBlur.Soft -> 1.dp\n        GlassBlur.Medium -> 3.dp", "GlassBlur.Soft -> 2.dp\n        GlassBlur.Medium -> 5.dp", "Glass shadow")
          text = replace_once(text, "Color.White.copy(alpha = if (selected) 0.68f else 0.52f)", "Color.Black.copy(alpha = if (selected) 0.12f else 0.075f)", "Glass light border")
          text = replace_once(text, "else -> Color.White.copy(alpha = if (dark) 0.11f else 0.30f)", "else -> Color.White.copy(alpha = if (dark) 0.11f else 0.58f)", "Glass top light")
          text = replace_once(text, "val sideLight = Color.White.copy(alpha = if (dark) 0.035f else 0.09f)", "val sideLight = Color.White.copy(alpha = if (dark) 0.035f else 0.17f)", "Glass side light")
          text = replace_once(text, "1f to Color.Black.copy(alpha = if (dark) 0.08f else 0.025f)", "1f to Color.Black.copy(alpha = if (dark) 0.08f else 0.045f)", "Glass lowlight")
          write(path, text)

          # A single lens glides between bottom-navigation destinations.
          path = "app/src/main/java/com/owlcoder/animeschedule/presentation/navigation/AnimeBottomBar.kt"
          text = read(path)
          text = replace_once(text, "import androidx.compose.animation.core.animateFloatAsState", "import androidx.compose.animation.core.animateDpAsState\nimport androidx.compose.animation.core.animateFloatAsState", "Bottom nav animation import")
          text = replace_once(text, "import androidx.compose.foundation.layout.Box\n", "import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.BoxWithConstraints\n", "Bottom nav box import")
          text = replace_once(text, "import androidx.compose.foundation.layout.only\n", "import androidx.compose.foundation.layout.offset\nimport androidx.compose.foundation.layout.only\n", "Bottom nav offset import")
          text = replace_once(text, "import androidx.compose.foundation.layout.size\n", "import androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.width\n", "Bottom nav width import")
          text = regex_once(
              text,
              r"@Composable\nfun AnimeBottomBar\(.*?\n\}\n\n@Composable\nprivate fun BottomNavItemView",
              '''@Composable
          fun AnimeBottomBar(
              navController: NavController,
              notificationCount: Int = 0,
          ) {
              val backStackEntry by navController.currentBackStackEntryAsState()
              val currentRoute = backStackEntry?.destination?.route
              val motion = LocalMotionPolicy.current

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .windowInsetsPadding(WindowInsets.navigationBars.only(WindowInsetsSides.Bottom))
                      .padding(horizontal = 16.dp, vertical = 6.dp),
              ) {
                  GlassChrome(
                      modifier = Modifier.fillMaxWidth().height(DockHeight),
                      shape = DockShape,
                  ) {
                      BoxWithConstraints(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(DockHeight)
                              .padding(horizontal = 3.dp, vertical = 3.dp),
                      ) {
                          val selectedIndex = items.indexOfFirst { currentRoute == it.screen.route }.coerceAtLeast(0)
                          val itemWidth = maxWidth / items.size.toFloat()
                          val indicatorX by animateDpAsState(
                              targetValue = itemWidth * selectedIndex.toFloat(),
                              animationSpec = motion.iosSpring(),
                              label = "bottom-tab-indicator-position",
                          )
                          val dark = MaterialTheme.colorScheme.background.luminance() < 0.35f
                          Surface(
                              modifier = Modifier
                                  .offset(x = indicatorX + itemWidth * 0.09f)
                                  .width(itemWidth * 0.82f)
                                  .fillMaxHeight(),
                              shape = ContinuousRoundedShape(14.dp),
                              color = if (dark) Color.White.copy(alpha = 0.065f) else Color.White.copy(alpha = 0.54f),
                              border = BorderStroke(
                                  0.5.dp,
                                  if (dark) Color.White.copy(alpha = 0.10f) else Color.Black.copy(alpha = 0.075f),
                              ),
                              tonalElevation = 0.dp,
                              shadowElevation = 0.dp,
                          ) {}
                          Row(
                              modifier = Modifier.fillMaxSize(),
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              items.forEach { item ->
                                  BottomNavItemView(
                                      item = item,
                                      selected = currentRoute == item.screen.route,
                                      notificationCount = if (item.screen == Screen.Schedule) notificationCount else 0,
                                      modifier = Modifier.weight(1f),
                                      onClick = {
                                          if (currentRoute != item.screen.route) {
                                              navController.navigate(item.screen.route) {
                                                  popUpTo(navController.graph.startDestinationId) { saveState = true }
                                                  launchSingleTop = true
                                                  restoreState = true
                                              }
                                          }
                                      },
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun BottomNavItemView''',
              "AnimeBottomBar function",
          )
          text = regex_once(
              text,
              r"    val motion = LocalMotionPolicy.current\n    val dark = .*?\n    val scale by animateFloatAsState\(",
              "    val motion = LocalMotionPolicy.current\n    val scale by animateFloatAsState(",
              "Bottom item old fill state",
          )
          text = replace_once(text, "color = fill,\n            border = BorderStroke(0.5.dp, borderColor),", "color = Color.Transparent,\n            border = null,", "Bottom item transparent surface")
          write(path, text)

          # Settings sign-in action: primary icon and text only.
          path = "app/src/main/java/com/owlcoder/animeschedule/presentation/screens/settings/SettingsScreen.kt"
          text = read(path)
          text = regex_once(
              text,
              r"            !isLoggedIn -> Surface\(.*?\n            else -> Row\(",
              '''            !isLoggedIn -> Row(
                  modifier = Modifier
                      .height(40.dp)
                      .clickable(onClick = onClick)
                      .padding(horizontal = 8.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(6.dp),
              ) {
                  Icon(
                      Icons.Default.Key,
                      contentDescription = null,
                      modifier = Modifier.size(17.dp),
                      tint = MaterialTheme.colorScheme.primary,
                  )
                  Text(
                      text = stringResource(R.string.profile_login),
                      style = MaterialTheme.typography.labelLarge,
                      color = MaterialTheme.colorScheme.primary,
                      fontWeight = FontWeight.SemiBold,
                  )
              }
              else -> Row(''',
              "Settings sign-in action",
          )
          write(path, text)

          # Localize signed-out My List benefits.
          path = "app/src/main/java/com/owlcoder/animeschedule/presentation/screens/mylist/MyListScreen.kt"
          text = read(path)
          for old, new in {
              'title = "Keep progress synced",': 'title = stringResource(R.string.mylist_benefit_sync_title),',
              'subtitle = "Access your list across all your devices.",': 'subtitle = stringResource(R.string.mylist_benefit_sync_subtitle),',
              'title = "Update watch status",': 'title = stringResource(R.string.mylist_benefit_status_title),',
              'subtitle = "Track episodes and continue where you left off.",': 'subtitle = stringResource(R.string.mylist_benefit_status_subtitle),',
              'title = "Save scores",': 'title = stringResource(R.string.mylist_benefit_scores_title),',
              'subtitle = "Rate anime and keep your scores safe.",': 'subtitle = stringResource(R.string.mylist_benefit_scores_subtitle),',
          }.items():
              text = replace_once(text, old, new, "My List translation")
          write(path, text)

          add_strings(
              "app/src/main/res/values/strings.xml",
              '''    <string name="mylist_benefit_sync_title">Keep progress synced</string>
              <string name="mylist_benefit_sync_subtitle">Access your list across all your devices.</string>
              <string name="mylist_benefit_status_title">Update watch status</string>
              <string name="mylist_benefit_status_subtitle">Track episodes and continue where you left off.</string>
              <string name="mylist_benefit_scores_title">Save scores</string>
              <string name="mylist_benefit_scores_subtitle">Rate anime and keep your scores safe.</string>''',
              "mylist_benefit_sync_title",
          )
          add_strings(
              "app/src/main/res/values-b+sr+Latn/strings.xml",
              '''    <string name="mylist_benefit_sync_title">Sinhronizuj napredak</string>
              <string name="mylist_benefit_sync_subtitle">Pristupi svojoj listi na svim uređajima.</string>
              <string name="mylist_benefit_status_title">Ažuriraj status gledanja</string>
              <string name="mylist_benefit_status_subtitle">Prati epizode i nastavi tamo gde si stao.</string>
              <string name="mylist_benefit_scores_title">Sačuvaj ocene</string>
              <string name="mylist_benefit_scores_subtitle">Ocenjuj anime i bezbedno čuvaj svoje ocene.</string>''',
              "mylist_benefit_sync_title",
          )

          # Dashboard cards become a connected timeline with more left breathing room.
          path = "app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt"
          text = read(path)
          text = replace_once(text, "import androidx.compose.foundation.BorderStroke\n", "import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.background\n", "Schedule background import")
          text = replace_once(text, "import androidx.compose.foundation.layout.heightIn\n", "import androidx.compose.foundation.layout.heightIn\nimport androidx.compose.foundation.layout.matchParentSize\n", "Schedule match import")
          text = replace_once(text, "import androidx.compose.foundation.shape.RoundedCornerShape", "import androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape", "Schedule circle import")
          text = regex_once(
              text,
              r"@Composable\nprivate fun UpcomingAiringList\(.*?\n\}\n\n@Composable\nprivate fun UpcomingAiringRow",
              '''@Composable
          private fun UpcomingAiringList(
              episodes: List<AiringEpisode>,
              isLoggedIn: Boolean,
              pendingIncrementIds: Set<Int>,
              onCardClick: (AiringEpisode) -> Unit,
              onIncrementEpisode: (AiringEpisode) -> Unit,
              onEditStatus: (AiringEpisode) -> Unit,
          ) {
              val motion = LocalMotionPolicy.current
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .animateContentSize(animationSpec = motion.iosSpring()),
              ) {
                  Box(
                      modifier = Modifier
                          .matchParentSize()
                          .padding(start = 11.5.dp, top = 34.dp, bottom = 34.dp),
                      contentAlignment = Alignment.CenterStart,
                  ) {
                      Box(
                          modifier = Modifier
                              .width(1.dp)
                              .fillMaxHeight()
                              .background(MaterialTheme.colorScheme.outlineVariant),
                      )
                  }
                  Column(verticalArrangement = Arrangement.spacedBy(9.dp)) {
                      episodes.forEachIndexed { index, episode ->
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                          ) {
                              Box(
                                  modifier = Modifier.width(24.dp),
                                  contentAlignment = Alignment.Center,
                              ) {
                                  Surface(
                                      modifier = Modifier.size(if (index == 0) 9.dp else 7.dp),
                                      shape = CircleShape,
                                      color = if (index == 0) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.outline,
                                      border = BorderStroke(2.dp, MaterialTheme.colorScheme.background),
                                  ) {}
                              }
                              AppMaterialSurface(
                                  modifier = Modifier.weight(1f),
                                  material = AppMaterial.Grouped,
                                  shape = MaterialTheme.shapes.extraLarge,
                              ) {
                                  UpcomingAiringRow(
                                      episode = episode,
                                      isLoggedIn = isLoggedIn,
                                      isIncrementing = episode.malId in pendingIncrementIds,
                                      onClick = { onCardClick(episode) },
                                      onIncrement = { onIncrementEpisode(episode) },
                                      onEditStatus = { onEditStatus(episode) },
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun UpcomingAiringRow''',
              "Upcoming timeline list",
          )
          text = replace_once(text, ".padding(horizontal = 8.dp, vertical = 5.dp),", ".padding(start = 12.dp, end = 8.dp, top = 6.dp, bottom = 6.dp),", "Upcoming row padding")
          write(path, text)
          PY

      - name: Commit patched UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git commit -m "Polish glass, navigation, dashboard and translations"
          git push origin HEAD:agent/ios26-ui-polish
