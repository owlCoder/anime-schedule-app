name: Final timeline and settings polish

on:
  push:
    branches:
      - agent/ios26-ui-polish
    paths:
      - .github/workflows/final-timeline-settings-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios26-ui-polish
          fetch-depth: 0
      - name: Apply UI changes
        shell: bash
        run: |
          echo '' | base64 --decode | python3
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git rm .github/workflows/final-timeline-settings-polish.yml
          git add app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt app/src/main/java/com/owlcoder/animeschedule/presentation/screens/settings/SettingsScreen.kt
          git commit -m "Polish schedule timeline and settings glass icons"
          git push origin HEAD:agent/ios26-ui-polish
