name: Schedule empty state and timeline polish

on:
  push:
    branches:
      - agent/ios26-ui-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ios26-ui-polish
          fetch-depth: 0

      - name: Apply schedule polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          path = Path("app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt")
          text = path.read_text()

          old_empty = '''                        } else {
                            AppMaterialSurface(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .clickable(onClick = onSeeAll),
                                material = AppMaterial.Grouped,
                                shape = MaterialTheme.shapes.large,
                            ) {
                                Row(
                                    modifier = Modifier
                                        .fillMaxWidth()
                                        .padding(horizontal = 14.dp, vertical = 11.dp),
                                    verticalAlignment = Alignment.CenterVertically,
                                ) {
                                    Text(
                                        text = stringResource(R.string.schedule_nothing_else),
                                        modifier = Modifier.weight(1f),
                                        style = MaterialTheme.typography.bodySmall,
                                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                                    )
                                    Icon(
                                        Icons.Default.ChevronRight,
                                        contentDescription = null,
                                        modifier = Modifier.size(17.dp),
                                        tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                    )
                                }
                            }
                        }'''
          new_empty = '''                        } else {
                            ScheduleWindowEmptyState(onClick = onSeeAll)
                        }'''
          text = replace_once(text, old_empty, new_empty, "dashboard empty state")

          anchor = '''@Composable
private fun DashboardSectionHeader(
'''
          empty_composable = '''@Composable
private fun ScheduleWindowEmptyState(
    onClick: () -> Unit,
) {
    AppMaterialSurface(
        modifier = Modifier
            .fillMaxWidth()
            .clickable(onClick = onClick),
        material = AppMaterial.Grouped,
        shape = MaterialTheme.shapes.extraLarge,
    ) {
        Row(
            modifier = Modifier
                .fillMaxWidth()
                .padding(horizontal = 14.dp, vertical = 13.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.spacedBy(12.dp),
        ) {
            Surface(
                modifier = Modifier.size(42.dp),
                shape = CircleShape,
                color = MaterialTheme.colorScheme.primary.copy(alpha = 0.10f),
                border = BorderStroke(
                    0.5.dp,
                    MaterialTheme.colorScheme.primary.copy(alpha = 0.18f),
                ),
                tonalElevation = 0.dp,
            ) {
                Box(contentAlignment = Alignment.Center) {
                    Icon(
                        imageVector = Icons.Default.CalendarMonth,
                        contentDescription = null,
                        modifier = Modifier.size(21.dp),
                        tint = MaterialTheme.colorScheme.primary,
                    )
                }
            }
            Column(
                modifier = Modifier.weight(1f),
                verticalArrangement = Arrangement.spacedBy(3.dp),
            ) {
                Text(
                    text = stringResource(R.string.schedule_no_more_soon),
                    style = MaterialTheme.typography.titleSmall,
                    fontWeight = FontWeight.SemiBold,
                    color = MaterialTheme.colorScheme.onSurface,
                )
                Text(
                    text = stringResource(R.string.schedule_open_full_day),
                    style = MaterialTheme.typography.bodySmall,
                    color = MaterialTheme.colorScheme.onSurfaceVariant,
                )
                Row(
                    verticalAlignment = Alignment.CenterVertically,
                    horizontalArrangement = Arrangement.spacedBy(4.dp),
                ) {
                    Text(
                        text = stringResource(R.string.schedule_see_all),
                        style = MaterialTheme.typography.labelMedium,
                        fontWeight = FontWeight.SemiBold,
                        color = MaterialTheme.colorScheme.primary,
                    )
                    Icon(
                        imageVector = Icons.AutoMirrored.Filled.ArrowForward,
                        contentDescription = null,
                        modifier = Modifier.size(14.dp),
                        tint = MaterialTheme.colorScheme.primary,
                    )
                }
            }
            Icon(
                imageVector = Icons.Default.ChevronRight,
                contentDescription = null,
                modifier = Modifier.size(17.dp),
                tint = MaterialTheme.colorScheme.onSurfaceVariant,
            )
        }
    }
}

'''
          text = replace_once(text, anchor, empty_composable + anchor, "empty state composable")

          old_see_all = '''        LazyColumn(
            modifier = Modifier
                .fillMaxWidth()
                .heightIn(max = 650.dp),
            contentPadding = PaddingValues(bottom = 12.dp),
        ) {
            items(
                items = episodes.sortedBy { it.airingAtEpochSeconds },
                key = { "schedule-overlay-${it.airingId}" },
            ) { episode ->
                UpcomingAiringRow(
                    episode = episode,
                    isLoggedIn = isLoggedIn,
                    isIncrementing = episode.malId in pendingIncrementIds,
                    onClick = { onAnimeClick(episode) },
                    onIncrement = { onIncrementEpisode(episode) },
                    onEditStatus = { onEditStatus(episode) },
                )
                HorizontalDivider(
                    modifier = Modifier.padding(start = 108.dp),
                    thickness = 0.5.dp,
                    color = MaterialTheme.colorScheme.outlineVariant,
                )
            }
        }'''
          new_see_all = '''        if (episodes.isEmpty()) {
            EmptyState(
                icon = Icons.Default.CalendarMonth,
                title = stringResource(R.string.schedule_empty_title),
                subtitle = stringResource(R.string.schedule_empty_subtitle),
                modifier = Modifier
                    .fillMaxWidth()
                    .height(190.dp),
            )
        } else {
            LazyColumn(
                modifier = Modifier
                    .fillMaxWidth()
                    .heightIn(max = 650.dp),
                contentPadding = PaddingValues(bottom = 12.dp),
            ) {
                item(key = "schedule-overlay-timeline") {
                    UpcomingAiringList(
                        episodes = episodes.sortedBy { it.airingAtEpochSeconds },
                        isLoggedIn = isLoggedIn,
                        pendingIncrementIds = pendingIncrementIds,
                        onCardClick = onAnimeClick,
                        onIncrementEpisode = onIncrementEpisode,
                        onEditStatus = onEditStatus,
                    )
                }
            }
        }'''
          text = replace_once(text, old_see_all, new_see_all, "see all timeline")
          path.write_text(text)

          for resource_path, old, new in [
              (
                  Path("app/src/main/res/values/ui_polish_strings.xml"),
                  '    <string name="schedule_nothing_else">Nothing else is airing in this window. Open the full day schedule.</string>',
                  '    <string name="schedule_nothing_else">Nothing else is airing in this window.</string>\n    <string name="schedule_open_full_day">Open the full-day schedule</string>',
              ),
              (
                  Path("app/src/main/res/values-b+sr+Latn/ui_polish_strings.xml"),
                  '    <string name="schedule_nothing_else">Ništa drugo se ne emituje u ovom periodu. Otvori ceo dnevni raspored.</string>',
                  '    <string name="schedule_nothing_else">Ništa drugo se ne emituje u ovom periodu.</string>\n    <string name="schedule_open_full_day">Otvori ceo dnevni raspored</string>',
              ),
          ]:
              resource = resource_path.read_text()
              resource = replace_once(resource, old, new, str(resource_path))
              resource_path.write_text(resource)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git rm .github/workflows/schedule-empty-timeline-polish.yml
          git add app/src/main/java/com/owlcoder/animeschedule/presentation/screens/schedule/ScheduleScreen.kt \
                  app/src/main/res/values/ui_polish_strings.xml \
                  app/src/main/res/values-b+sr+Latn/ui_polish_strings.xml
          git commit -m "polish schedule empty state and see all timeline"
          git push origin HEAD:agent/ios26-ui-polish
